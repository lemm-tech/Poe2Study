; Plug.exe / NavGUI.exe / Monitor.dll runtime configuration.
; Build copies this template to plug/bin/<Configuration>/config.ini.

[game] useLocalRpm=1），
;   [ola] 段实际不参与任何内存读取，留空也能正常跑。
; ============================================================

[game]
; 游戏窗口标题（SendInput 前要把游戏切到前台；按宽字符匹配）
windowTitle = Path of Exile 2
; 游戏主模块名（取模块基址用）
moduleName  = PathOfExile.exe
; 优先用本地 ReadProcessMemory 读内存（1=是），不依赖 OLA 授权
; OLA 授权过期时 Reg() 会卡死，本地 RPM 没这个风险
useLocalRpm = 1

[pipe]
; 命名管道短名，两端共用（实际名字是 \\.\pipe\<name>）
name = Lmy

[output]
; 地图位图输出路径
;   相对路径 = 相对 Plug.exe 所在目录解析（不依赖当前工作目录）
;   父目录不存在会自动创建
;   绝对路径（C:\... 或 \\server\...）原样使用
;
; ★ 留空 = 不落盘任何诊断图。
;
;   空值只关掉"最后一步把内存数据写成 BMP"，整条链路的上游一点都不变：
;     Monitor 从游戏内存读 CostBuffer → 管道传给 Plug/GUI
;     → 建 NavGrid → 跑 A* → 下发航点
;   地图数据是该读什么还读什么，寻路结果、判墙判定、走路行为全部不受影响。
;   省掉的是每次寻路 4 张全图渲染 + 约 55 MB 磁盘写入：
;       map_cost.bmp           代价灰度图
;       map_cost_grid.bmp      判墙结果图
;       map_cost_path.bmp      路径图
;       map_cost_path_overlay.bmp  路径叠加图（判定穿墙的主力图）
;
;   什么时候需要它：路径明显有问题、想离线复盘"判墙对不对 / 路线有没有
;   压在黑色障碍上"。那时把路径填回去跑一次 dryRun（navigate -dry）就行，
;   不需要重编译。
bmpPath =
; Monitor.dll 的日志文件名（落在 DLL 同目录）
logPath = monitor_log.txt


[nav]
; Raw-pixel A* + visibility-checked corners + monotonic route following.
; Distances stay in the existing integer map/WalkCall coordinate unit.
stepDistance = 126
arriveTolerance = 13
waypointTolerance = 3
; Actual-motion observation (ms); no blind 800ms wait after each call.
pollMs = 80
leadMs = 120
minCallMs = 200
startupMs = 350
stepWaitMs = 3000
stillSamples = 3
stallLimit = 3
deviateDistance = 12
positionRetries = 3
recoveryLimit = 8
; Backoff only after a failed plan; not the normal movement cadence.
replanMs = 800

[skill]
; ---- 技能 call（RVA 0x18C940）的熔断参数 ----
; minIntervalMs：两次真实 Cast 的最小间隔（毫秒）。
;
;   ★ 旧版默认 30000，理由是"实测 5~6 秒间隔会失败并卡死，32 秒才成功"。
;     但那个现象的真正原因是**引用计数被扣到 0**：第一次调用把技能槽的
;     _Uses 从 2 扣到 1，第二次再扣就是 0 -> 技能对象当场析构 -> 卡死。
;     跟"间隔长短"没有因果关系，只跟"连续调了几次"有关。
;
;   ★ 引用计数修好之后的实测（2026-11-09，同一局）：
;       间隔 30000ms  连续 3 次  全成功，计数每次配平
;       间隔  8000ms  连续 3 次  全成功，计数每次配平
;       间隔  3000ms  连续 4 次  全成功，计数每次配平
;
;   ★ 当前值 3000：单次诊断调用的最小间隔下限。
;     别再往下压到 2000 以下：maxPerSecond 是 1，低于 1 秒的间隔
;     会被每秒上限直接拒掉。
minIntervalMs = 3000

; maxCasts：单次注入允许的真实 Cast 次数上限（0 = 不限制）。
;   纯兜底，限制单次注入期间的真实调用总数，防止调试脚本循环。
maxCasts = 500
